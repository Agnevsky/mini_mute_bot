<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHL Tournament</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static_tournament/style.css">
</head>
<body>

  <div class="header">
    <div>
      <div class="header-title">🏒 NHL Tournament</div>
      <div class="header-subtitle">Original Place · Балашиха</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('main', this)">Главная</button>
    <button class="tab" onclick="switchTab('results', this)">Результаты</button>
    <button class="tab" onclick="switchTab('stats', this)">Статистика</button>
  </div>

  <div id="panel-main" class="panel active">
    <div class="glass">
      <div class="section-title">Турнирная таблица</div>
      <table id="tournament">
        <thead>
          <tr>
            <th>#</th>
            <th class="left">Игрок</th>
            <th>Команда</th>
            <th>И</th>
            <th>В</th>
            <th>П</th>
            <th>О</th>
            <th>ЗГ</th>
            <th>ПГ</th>
            <th>+/-</th>
          </tr>
        </thead>
        <tbody><tr><td colspan="10" class="loading">Загрузка...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="panel-results" class="panel">
    <div class="glass">
      <div class="section-title">Последние результаты</div>
      <div class="results-list" id="results-list">
        <div class="empty-state">Результаты появятся здесь</div>
      </div>
    </div>
  </div>

  <div id="panel-stats" class="panel">
    <div class="glass">
      <div class="section-title">Лидеры сезона</div>
      <div class="stats-grid" id="stats-grid">
        <div class="loading">Загрузка...</div>
      </div>
    </div>
  </div>

  <script src="/static_tournament/script.js"></script>
</body>
</html>
